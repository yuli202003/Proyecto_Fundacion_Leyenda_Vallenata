<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="theme-color" content="#212529">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #212529;
      color: #ffffff;
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 32rem;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-family: Rockwell, Georgia, serif;
      font-size: 2.25rem;
      line-height: 1.1;
    }

    p {
      margin: 0 0 1.75rem;
      color: #ced4da;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #dc3545;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 0.2rem;
    }

    a:hover {
      background: #b02a37;
    }

<body>
  <main>
    <h1>No encontramos esta página</h1>

    <a id="home-link" href="/">Ir al inicio</a>
  </main>
  <script>
    const isProjectPage = location.hostname.endsWith("github.io");
    document.querySelector("#home-link").href = isProjectPage ? `/${location.pathname.split("/")[1]}/` : "/";
